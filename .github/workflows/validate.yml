name: Validate invoice tracker

on:
  pull_request:
  push:
    branches:
      - feature/user-auth-email-verification

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run regression and authentication tests
        run: npm test
      - name: Build production frontend
        run: npm run build
